<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Shoptorshi Game</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;overflow:hidden;background:#06060f;font-family:'Courier New',monospace;touch-action:none;overscroll-behavior:none}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#1a1a2e;border:2px solid #00d4ff;box-shadow:0 0 25px rgba(0,212,255,.35);position:relative;z-index:1}
  #hud{position:absolute;top:0;left:0;right:0;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:5;color:#fff;font-size:15px;font-weight:bold;text-shadow:1px 1px 2px #000}
  #hud.hidden{display:none}
  #hud-pts{color:#ffcc00;text-shadow:0 0 6px #ffcc00,1px 1px 2px #000}
  #hud-lives{color:#ff3366;text-shadow:0 0 6px #ff3366,1px 1px 2px #000}
  #hud-menu{pointer-events:auto;background:rgba(0,212,255,.15);border:1px solid #00d4ff;color:#00d4ff;font-family:inherit;font-size:12px;font-weight:bold;padding:5px 10px;border-radius:4px;cursor:pointer;letter-spacing:1px}
  #hud-menu:active{background:rgba(0,212,255,.5);color:#fff}
  #touch{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px;pointer-events:none;z-index:6}
  #touch.hidden{display:none}
  .dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;pointer-events:none}
  .btn{pointer-events:auto;display:flex;align-items:center;justify-content:center;background:rgba(0,212,255,.15);border:2px solid rgba(0,212,255,.7);color:#00d4ff;font-size:18px;font-weight:bold;border-radius:10px;font-family:inherit;touch-action:none}
  .btn.active{background:rgba(0,212,255,.6);color:#fff}
  .dpad .btn[data-k="up"]{grid-column:2;grid-row:1}
  .dpad .btn[data-k="left"]{grid-column:1;grid-row:2}
  .dpad .btn[data-k="right"]{grid-column:3;grid-row:2}
  .dpad .btn[data-k="down"]{grid-column:2;grid-row:3}
  #jump-btn{width:86px;height:86px;border-radius:50%;font-size:13px;background:rgba(0,255,136,.15);border-color:rgba(0,255,136,.75);color:#00ff88;letter-spacing:1px}
  #jump-btn.active{background:rgba(0,255,136,.55);color:#fff}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(6,6,15,.94);color:#fff;text-align:center;padding:20px;z-index:10;overflow-y:auto}
  #overlay.hidden{display:none}
  #overlay h1{color:#00d4ff;font-size:1.9em;letter-spacing:3px;margin-bottom:6px;text-shadow:0 0 14px #00d4ff}
  #overlay h2{color:#00ff88;font-size:1.4em;margin-bottom:10px;text-shadow:0 0 12px #00ff88}
  #overlay h2.bad{color:#ff3366;text-shadow:0 0 12px #ff3366}
  #overlay p{color:#aaa;font-size:.9em;margin-bottom:16px;line-height:1.5}
  .hearts{display:flex;gap:8px;margin-bottom:18px}
  .heart{width:26px;height:26px;background:#ff3366;clip-path:polygon(50% 100%,0 35%,15% 0,50% 20%,85% 0,100% 35%);animation:p 1s infinite alternate}
  .heart:nth-child(2){animation-delay:.1s}.heart:nth-child(3){animation-delay:.2s}
  .heart:nth-child(4){animation-delay:.3s}.heart:nth-child(5){animation-delay:.4s}
  .heart:nth-child(6){animation-delay:.5s}.heart:nth-child(7){animation-delay:.6s}
  @keyframes p{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.18);opacity:1}}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:420px;width:100%;margin-top:8px}
  .lvl{aspect-ratio:1;background:#12122a;border:2px solid #00d4ff;color:#fff;font-size:1.4em;font-weight:bold;display:flex;align-items:center;justify-content:center;border-radius:8px;position:relative;cursor:pointer;font-family:inherit}
  .lvl:active{transform:scale(.95)}
  .lvl.locked{border-color:#333;color:#333;cursor:default}
  .lvl.locked::after{content:'🔒';position:absolute;font-size:1em}
  .lvl.done{border-color:#00ff88;color:#00ff88;box-shadow:0 0 8px rgba(0,255,136,.4)}
  .lvl small{position:absolute;bottom:4px;font-size:9px;color:#777;font-weight:normal}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .obtn{padding:12px 22px;border:none;border-radius:8px;font-family:inherit;font-size:14px;font-weight:bold;letter-spacing:1px;cursor:pointer;color:#06060f;background:#00d4ff}
  .obtn.green{background:#00ff88}.obtn.yellow{background:#ffcc00}
  .obtn.red{background:#ff3366;color:#fff}
  .obtn:active{transform:scale(.95)}
  .bar{width:220px;height:5px;background:#222;border-radius:3px;overflow:hidden;margin-top:20px}
  .bar>div{height:100%;width:0;background:#00d4ff;transition:width .3s}
</style>
</head>
<body>
<div id="app">
  <canvas id="c" width="480" height="640"></canvas>
  <div id="hud" class="hidden">
    <span id="hud-pts">★ 0</span>
    <button id="hud-menu">MENU</button>
    <span id="hud-lives">❤ 7</span>
  </div>
  <div id="touch" class="hidden">
    <div class="dpad">
      <div class="btn" data-k="up">▲</div>
      <div class="btn" data-k="left">◀</div>
      <div class="btn" data-k="right">▶</div>
      <div class="btn" data-k="down">▼</div>
    </div>
    <div class="btn" id="jump-btn" data-k="jump">JUMP</div>
  </div>
  <div id="overlay"></div>
</div>

<script>
'use strict';
// ============ CONSTANTS ============
const W = 480, H = 640;
const API = 'https://script.google.com/macros/s/AKfycbyiZJwtCwv8ogplxQx5xlL7nERISw0hxSdViNN3UBsdp_dXFfSrKPOA1ah52BeMFLeW/exec';

// ============ DOM ============
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const overlayEl = document.getElementById('overlay');
const hudEl = document.getElementById('hud');
const hudPtsEl = document.getElementById('hud-pts');
const hudLivesEl = document.getElementById('hud-lives');
const touchEl = document.getElementById('touch');
const jumpBtnEl = document.getElementById('jump-btn');

function fitCanvas(){
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width  = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', ()=>setTimeout(fitCanvas, 120));
fitCanvas();

// ============ STATE ============
const G = {
  screen: 'loading',
  lives: 7,
  points: 0,
  unlocked: [true,false,false,false,false,false,false],
  completed:[false,false,false,false,false,false,false],
  playerId: 'p_'+Math.random().toString(36).slice(2,11)
};
let levelIdx = 0;
let L = null;
let wonThisSession = false;

// ============ ASSETS ============
const A = { still:null, hurt:null, walk:[null,null,null], jump:[null,null,null], fall:[null,null,null], music:{} };

function loadImg(src){
  return new Promise(res=>{
    const i = new Image();
    i.onload = ()=>res(i);
    i.onerror = ()=>res(null);
    i.src = src;
  });
}
function loadAudio(src){
  return new Promise(res=>{
    const a = new Audio();
    a.preload = 'auto';
    a.addEventListener('canplaythrough', ()=>res(a), {once:true});
    a.addEventListener('error', ()=>res(null), {once:true});
    a.src = src;
    // Reduced 2s safety (parallel loading means worst case = 2s, not 28s)
    setTimeout(()=>res(a), 2000);
  });
}

async function loadAssets(){
  const bar = document.querySelector('#overlay .bar>div');
  const total = 14;
  let done = 0;
  const tick = ()=>{ done++; if(bar) bar.style.width = (done/total*100)+'%'; };

  // PARALLEL loading — worst case ~2s not ~28s
  const jobs = [];
  for(let i=1;i<=7;i++){
    jobs.push(loadAudio('l'+i+'.mp3').then(a=>{ A.music['l'+i] = a; tick(); }));
  }
  jobs.push(loadImg('still.png').then(i=>{ A.still = i; tick(); }));
  jobs.push(loadImg('hurt.png').then(i=>{ A.hurt = i; tick(); }));
  for(let i=0;i<3;i++) jobs.push(loadImg('walk'+(i+1)+'.png').then(im=>{ A.walk[i] = im; tick(); }));
  for(let i=0;i<3;i++) jobs.push(loadImg('jump'+(i+1)+'.png').then(im=>{ A.jump[i] = im; tick(); }));
  for(let i=0;i<3;i++) jobs.push(loadImg('fall'+(i+1)+'.png').then(im=>{ A.fall[i] = im; tick(); }));

  await Promise.all(jobs);
}

// ============ MUSIC ============
function stopAllMusic(){
  for(let i=1;i<=7;i++){
    const a = A.music['l'+i];
    if(a){ try{ a.pause(); a.currentTime = 0; }catch(e){} }
  }
}
function playMusic(n, loop=true){
  stopAllMusic();
  const a = A.music['l'+n];
  if(!a) return;
  try{
    a.loop = loop;
    a.currentTime = 0;
    const p = a.play();
    if(p && p.catch) p.catch(()=>{});
  }catch(e){}
}

// ============ HUD ============
function refreshHUD(){
  hudPtsEl.textContent   = '★ ' + G.points;
  hudLivesEl.textContent = '❤ ' + G.lives;
}
function setLives(n){ G.lives = n; refreshHUD(); }
function setPoints(n){ G.points = n; refreshHUD(); }

// ============ SCREENS ============
function showOverlay(html){
  overlayEl.innerHTML = html;
  overlayEl.classList.remove('hidden');
}
function hideOverlay(){
  overlayEl.classList.add('hidden');
  overlayEl.innerHTML = '';
}

function showLoading(){
  showOverlay(`
    <div class="hearts">
      <div class="heart"></div><div class="heart"></div><div class="heart"></div>
      <div class="heart"></div><div class="heart"></div><div class="heart"></div>
      <div class="heart"></div>
    </div>
    <h1>SHOPTORSHI</h1>
    <p>Loading…</p>
    <div class="bar"><div></div></div>
  `);
}

function showMenu(){
  G.screen = 'menu';
  wonThisSession = false;
  stopAllMusic();
  hudEl.classList.add('hidden');
  touchEl.classList.add('hidden');
  destroyLevel();

  let grid = '';
  for(let i=0;i<7;i++){
    const locked = !G.unlocked[i];
    const done = G.completed[i];
    const cls = 'lvl' + (locked?' locked':'') + (done?' done':'');
    grid += `<div class="${cls}" data-lvl="${i}">${i+1}<small>${(i+1)*7}pt</small></div>`;
  }
  showOverlay(`
    <h1>SHOPTORSHI</h1>
    <p>Select a level — 7 lives per level</p>
    <div class="grid">${grid}</div>
    <p style="margin-top:14px;font-size:.75em">Earn 7 points to unlock the next level</p>
  `);

  overlayEl.querySelectorAll('.lvl').forEach(el=>{
    if(el.classList.contains('locked')) return;
    el.addEventListener('click', ()=>startLevel(parseInt(el.dataset.lvl)));
  });
}

function showComplete(){
  G.screen = 'complete';
  hudEl.classList.add('hidden');
  touchEl.classList.add('hidden');
  stopAllMusic();

  const nextIdx = levelIdx + 1;
  const hasNext = nextIdx < 7 && G.unlocked[nextIdx];
  const nextBtn = hasNext ? `<button class="obtn green" id="btn-next">NEXT LEVEL</button>` : '';
  const isLast = levelIdx === 6;
  const keepBtn = !isLast ? `<button class="obtn yellow" id="btn-keep">KEEP PLAYING</button>` : '';

  showOverlay(`
    <h2>LEVEL ${levelIdx+1} COMPLETE!</h2>
    <p>+7 points! Total: ${G.points}</p>
    <div class="btn-row">
      ${keepBtn}
      ${nextBtn}
      <button class="obtn" id="btn-menu">MENU</button>
    </div>
  `);

  if(!isLast) document.getElementById('btn-keep').addEventListener('click', keepPlaying);
  if(hasNext) document.getElementById('btn-next').addEventListener('click', ()=>startLevel(nextIdx));
  document.getElementById('btn-menu').addEventListener('click', showMenu);
}

function showGameOver(){
  G.screen = 'gameover';
  hudEl.classList.add('hidden');
  touchEl.classList.add('hidden');
  stopAllMusic();

  showOverlay(`
    <h2 class="bad">GAME OVER</h2>
    <p>Out of lives — try again!</p>
    <div class="btn-row">
      <button class="obtn red" id="btn-retry">RETRY</button>
      <button class="obtn" id="btn-menu">MENU</button>
    </div>
  `);
  document.getElementById('btn-retry').addEventListener('click', ()=>startLevel(levelIdx));
  document.getElementById('btn-menu').addEventListener('click', showMenu);
}

function showFinalEnd(){
  G.screen = 'gameover';
  hudEl.classList.add('hidden');
  touchEl.classList.add('hidden');
  stopAllMusic();

  showOverlay(`
    <h2>THE END</h2>
    <p>You reached the end of Shoptorshi's journey.</p>
    <p style="color:#ffcc00">★ Total Points: ${G.points}</p>
    <div class="btn-row">
      <button class="obtn green" id="btn-menu">BACK TO MENU</button>
    </div>
  `);
  document.getElementById('btn-menu').addEventListener('click', showMenu);
}

// ============ LEVEL FLOW ============
function startLevel(idx){
  if(idx < 0 || idx > 6) return;
  if(!G.unlocked[idx]) return;

  destroyLevel();
  levelIdx = idx;
  wonThisSession = false;

  hideOverlay();
  hudEl.classList.remove('hidden');

  // Touch controls: Level 2 (platformer) and Level 6 (boat)
  if(idx === 1 || idx === 5){
    touchEl.classList.remove('hidden');
    jumpBtnEl.style.display = (idx === 1 ? 'flex' : 'none');
  } else {
    touchEl.classList.add('hidden');
    jumpBtnEl.style.display = 'none';
  }

  setLives(7);
  refreshHUD();

  // Music: skip for Level 7 (plays on phone-pick). Loops for all others.
  if(idx !== 6) playMusic(idx + 1, true);

  L = LEVEL_FACTORIES[idx]();
  G.screen = 'playing';
  if(L.init) L.init();
}

function destroyLevel(){
  if(L && L.destroy){
    try{ L.destroy(); }catch(e){ console.error(e); }
  }
  L = null;
}

function completeLevel(){
  if(G.screen !== 'playing') return;
  if(wonThisSession) return;
  wonThisSession = true;

  if(!G.completed[levelIdx]){
    G.completed[levelIdx] = true;
    if(levelIdx < 6) G.unlocked[levelIdx + 1] = true;
    setPoints(G.points + 7);
    try{
      fetch(API+'?action=updateScore&playerId='+G.playerId+'&points=7').catch(()=>{});
      if(levelIdx < 6) fetch(API+'?action=unlockLevel&playerId='+G.playerId+'&level='+(levelIdx+2)).catch(()=>{});
    }catch(e){}
  }
  showComplete();
}

function loseLife(){
  if(G.screen !== 'playing') return true;
  G.lives--;
  refreshHUD();
  if(G.lives <= 0){ showGameOver(); return true; }
  return false;
}

function keepPlaying(){
  if(!wonThisSession) return;
  hideOverlay();
  hudEl.classList.remove('hidden');

  if(levelIdx === 1 || levelIdx === 5){
    touchEl.classList.remove('hidden');
    jumpBtnEl.style.display = (levelIdx === 1 ? 'flex' : 'none');
  }

  G.screen = 'playing';
  // BUG #8 FIX: restart music if paused
  const a = A.music['l'+(levelIdx + 1)];
  if(a){
    if(a.paused || a.ended){
      try{ a.currentTime = 0; a.play(); }catch(e){}
    }
  }
}

// ============ MAIN LOOP ============
let lastT = performance.now();
function loop(t){
  requestAnimationFrame(loop);
  const dt = Math.min((t - lastT) / 1000, 0.05);
  lastT = t;

  if(G.screen === 'playing' && L){
    try{ if(L.update) L.update(dt); }catch(e){ console.error('update', e); }
  }

  // BUG #14 FIX: always clear before draw
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);

  if(G.screen === 'playing' && L){
    try{ if(L.draw) L.draw(ctx); }catch(e){ console.error('draw', e); }
  }
}
requestAnimationFrame(loop);

// ============ TOUCH CONTROLS ============
function bindBtn(el){
  const key = el.dataset.k;
  const press = (e)=>{
    e.preventDefault();
    el.classList.add('active');
    if(L && L.keys) L.keys[key] = true;
    if(L && key === 'jump' && L.jump) L.jump();
  };
  const release = (e)=>{
    e.preventDefault();
    el.classList.remove('active');
    if(L && L.keys) L.keys[key] = false;
  };
  el.addEventListener('pointerdown', press);
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  el.addEventListener('pointerleave', release);
}
document.querySelectorAll('#touch .btn').forEach(bindBtn);

document.getElementById('hud-menu').addEventListener('click', ()=>{
  // BUG #11 FIX: also allow from 'playing' only (not during transitions)
  if(G.screen === 'playing') showMenu();
});

canvas.addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('touchmove', e=>{ if(e.target === canvas) e.preventDefault(); }, {passive:false});

// ============ LEVEL 1: FLAPPY (no boss) ============
function Level1(){
  const GRAV = 1300, FLAP = -370, PIPE_W = 60, GAP = 165, SPEED = 165;
  const st = {
    bird:{ x:110, y:H/2, vy:0, rot:0 },
    pipes:[], spawnT:0, passed:0,
    hurtFlash:0, invuln:0,
    keys:{left:false,right:false,up:false,down:false,jump:false}
  };
  function flap(){ st.bird.vy = FLAP; }
  function spawnPipe(){
    const gapY = 70 + Math.random() * (H - 280);
    st.pipes.push({ x:W, gapY, scored:false });
  }
  function hurt(){
    st.hurtFlash = 1;
    if(loseLife()) return true;
    // BUG #2 FIX: reset bird AND clear pipes to avoid re-collision
    st.bird.x = 110; st.bird.y = H/2; st.bird.vy = 0; st.bird.rot = 0;
    st.pipes = [];
    st.spawnT = 0;
    st.invuln = 1.2;
    return false;
  }
  const onKey = (e)=>{
    if(e.key===' '||e.key==='ArrowUp'||e.key==='w'){ e.preventDefault(); if(G.screen==='playing') flap(); }
  };
  const onPointer = (e)=>{
    if(G.screen !== 'playing') return;
    e.preventDefault();
    flap();
  };

  return {
    keys: st.keys,
    jump: flap,
    init(){
      document.addEventListener('keydown', onKey);
      canvas.addEventListener('pointerdown', onPointer);
    },
    update(dt){
      if(G.screen !== 'playing') return;
      st.hurtFlash = Math.max(0, st.hurtFlash - dt*3);
      st.invuln    = Math.max(0, st.invuln - dt);

      st.bird.vy += GRAV*dt;
      st.bird.y  += st.bird.vy*dt;
      st.bird.rot = Math.max(-0.5, Math.min(0.5, st.bird.vy/700));

      st.spawnT += dt;
      if(st.spawnT > 1.35){ st.spawnT = 0; spawnPipe(); }

      for(let i=st.pipes.length-1; i>=0; i--){
        const p = st.pipes[i];
        p.x -= SPEED*dt;
        if(p.x + PIPE_W < 0){ st.pipes.splice(i,1); continue; }
        if(!p.scored && p.x + PIPE_W < st.bird.x){
          p.scored = true;
          st.passed++;
          if(st.passed >= 7 && !wonThisSession) completeLevel();
        }
      }

      if(st.invuln > 0) return;

      // BUG #15 FIX: early-return chain so we don't double-hurt
      let hit = false;
      if(st.bird.y > H-20 || st.bird.y < 0) hit = true;
      if(!hit){
        for(const p of st.pipes){
          if(st.bird.x+18 > p.x && st.bird.x-18 < p.x+PIPE_W){
            if(st.bird.y-14 < p.gapY || st.bird.y+14 > p.gapY+GAP){ hit = true; break; }
          }
        }
      }
      if(hit){ hurt(); }
    },
    draw(ctx){
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'#1a1a3e'); g.addColorStop(.5,'#2a2a5e'); g.addColorStop(1,'#3a3a7e');
      ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

      ctx.fillStyle = 'rgba(255,255,255,.08)';
      for(let i=0;i<5;i++){
        const x = (i*130 + performance.now()*0.03) % (W+120) - 60;
        const y = 50 + i*75;
        ctx.beginPath();
        ctx.arc(x,y,30,0,Math.PI*2);
        ctx.arc(x+25,y-10,24,0,Math.PI*2);
        ctx.arc(x+50,y,20,0,Math.PI*2);
        ctx.fill();
      }

      for(const p of st.pipes){
        ctx.fillStyle = '#00ff88';
        ctx.fillRect(p.x, 0, PIPE_W, p.gapY);
        ctx.fillRect(p.x, p.gapY+GAP, PIPE_W, H-p.gapY-GAP);
        ctx.fillStyle = '#00cc66';
        ctx.fillRect(p.x-5, p.gapY-18, PIPE_W+10, 18);
        ctx.fillRect(p.x-5, p.gapY+GAP, PIPE_W+10, 18);
      }

      ctx.save();
      ctx.translate(st.bird.x, st.bird.y);
      ctx.rotate(st.bird.rot);
      const img = (st.hurtFlash>0 && A.hurt) ? A.hurt : A.still;
      if(st.invuln > 0 && Math.floor(performance.now()/100)%2===0) ctx.globalAlpha = 0.5;
      if(img) ctx.drawImage(img, -20,-20,40,40);
      else {
        ctx.fillStyle = st.hurtFlash>0 ? '#ff3366' : '#ffcc00';
        ctx.fillRect(-15,-15,30,30);
      }
      ctx.restore();

      // BUG #13 FIX: display capped at 7/7
      ctx.fillStyle = '#fff'; ctx.font = 'bold 22px Courier New'; ctx.textAlign = 'center';
      ctx.fillText(`${Math.min(7, st.passed)}/7`, W/2, 45);

      if(st.hurtFlash>0){
        ctx.fillStyle = `rgba(255,0,0,${st.hurtFlash*0.3})`;
        ctx.fillRect(0,0,W,H);
      }
    },
    destroy(){
      document.removeEventListener('keydown', onKey);
      canvas.removeEventListener('pointerdown', onPointer);
    }
  };
}

// ============ LEVEL 2: PLATFORMER ============
function Level2(){
  const GRAV = 1000, MOVE = 210, JUMP = -430, LEVEL_W = 2400;
  const st = {
    p:{ x:50, y:400, vx:0, vy:0, onGround:false, facing:1, anim:0, animT:0, mode:'idle' },
    platforms:[
      {x:0,    y:500, w:330, h:20},
      {x:390,  y:450, w:150, h:20},
      {x:590,  y:400, w:150, h:20},
      {x:790,  y:350, w:100, h:20},
      {x:940,  y:450, w:230, h:20},
      {x:1210, y:400, w:150, h:20},
      {x:1410, y:350, w:100, h:20},
      {x:1560, y:450, w:230, h:20},
      {x:1830, y:400, w:150, h:20},
      {x:2030, y:350, w:100, h:20},
      {x:2160, y:500, w:240, h:20},
      {x:0,    y:520, w:LEVEL_W, h:140}
    ],
    enemies:[
      {x:430,  y:420, w:30,h:30, min:390, max:490, dir:1,  spd:70},
      {x:630,  y:370, w:30,h:30, min:590, max:720, dir:1,  spd:90},
      {x:990,  y:420, w:30,h:30, min:940, max:1130,dir:-1, spd:80},
      {x:1260, y:370, w:30,h:30, min:1210,max:1340,dir:1,  spd:100},
      {x:1610, y:420, w:30,h:30, min:1560,max:1750,dir:-1, spd:70},
      {x:1870, y:370, w:30,h:30, min:1830,max:1960,dir:1,  spd:90},
      {x:2210, y:470, w:30,h:30, min:2160,max:2360,dir:-1, spd:80}
    ],
    princess:{ x:2280, y:300, gone:false },
    camX:0, hurtF:0, invuln:0, time:0, ended:false,
    keys:{left:false,right:false,up:false,down:false,jump:false}
  };

  const onKD = (e)=>{
    if(G.screen !== 'playing') return;
    if(e.key==='ArrowLeft'||e.key==='a') st.keys.left = true;
    if(e.key==='ArrowRight'||e.key==='d') st.keys.right = true;
    if(e.key==='ArrowUp'||e.key==='w'||e.key===' '){ e.preventDefault(); st.keys.jump = true; }
  };
  const onKU = (e)=>{
    if(e.key==='ArrowLeft'||e.key==='a') st.keys.left = false;
    if(e.key==='ArrowRight'||e.key==='d') st.keys.right = false;
    if(e.key==='ArrowUp'||e.key==='w'||e.key===' ') st.keys.jump = false;
  };
  const onTap = (e)=>{
    if(G.screen !== 'playing') return;
    if(st.p.onGround){ st.p.vy = JUMP; st.p.onGround = false; }
  };

  function hurt(fromX){
    if(st.invuln > 0) return false;
    st.hurtF = 1; st.invuln = 1.2;
    if(loseLife()) return true;
    st.p.vx = (st.p.x < fromX ? -1 : 1) * 220;
    st.p.vy = -280;
    return false;
  }

  return {
    keys: st.keys,
    init(){
      document.addEventListener('keydown', onKD);
      document.addEventListener('keyup', onKU);
      canvas.addEventListener('pointerdown', onTap);
    },
    update(dt){
      if(G.screen !== 'playing') return;
      st.time += dt;
      st.hurtF = Math.max(0, st.hurtF - dt*3);
      st.invuln = Math.max(0, st.invuln - dt);

      if(st.ended) return; // freeze the world when princess scene plays

      const accel = 1400, fric = 1000;
      if(st.keys.left){ st.p.vx = Math.max(-MOVE, st.p.vx - accel*dt); st.p.facing = -1; }
      else if(st.keys.right){ st.p.vx = Math.min(MOVE, st.p.vx + accel*dt); st.p.facing = 1; }
      else{
        if(st.p.vx > 0) st.p.vx = Math.max(0, st.p.vx - fric*dt);
        else if(st.p.vx < 0) st.p.vx = Math.min(0, st.p.vx + fric*dt);
      }

      if(st.keys.jump && st.p.onGround){ st.p.vy = JUMP; st.p.onGround = false; st.keys.jump = false; }

      st.p.vy = Math.min(st.p.vy + GRAV*dt, 700);
      st.p.x += st.p.vx*dt;
      st.p.x = Math.max(0, Math.min(LEVEL_W-30, st.p.x));
      st.p.y += st.p.vy*dt;
      st.p.onGround = false;

      for(const pl of st.platforms){
        if(st.p.x + 20 > pl.x && st.p.x < pl.x + pl.w){
          if(st.p.vy >= 0 && st.p.y + 30 > pl.y && st.p.y + 30 < pl.y + pl.h + 20){
            st.p.y = pl.y - 30;
            st.p.vy = 0;
            st.p.onGround = true;
          }
        }
      }

      if(!st.p.onGround) st.p.mode = st.p.vy < 0 ? 'jump' : 'fall';
      else if(Math.abs(st.p.vx) > 20) st.p.mode = 'walk';
      else st.p.mode = 'idle';
      st.p.animT += dt;
      if(st.p.animT > 0.14){ st.p.animT = 0; st.p.anim = (st.p.anim+1)%3; }

      for(const e of st.enemies){
        e.x += e.spd * e.dir * dt;
        if(e.x < e.min){ e.dir = 1; e.x = e.min; }
        if(e.x > e.max){ e.dir = -1; e.x = e.max; }
        if(st.p.x + 20 > e.x && st.p.x < e.x + e.w && st.p.y + 30 > e.y && st.p.y < e.y + e.h){
          if(hurt(e.x)) return;
        }
      }

      const targetCam = Math.max(0, Math.min(LEVEL_W - W, st.p.x - W/2));
      st.camX += (targetCam - st.camX) * Math.min(1, dt*7);

      if(!st.ended && st.p.x >= 2280){
        st.ended = true;
        st.princess.gone = true;
        setTimeout(()=>{ if(G.screen==='playing' && !wonThisSession) completeLevel(); }, 1600);
      }
    },
    draw(ctx){
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'#1a1a3e'); g.addColorStop(.6,'#2a2a5e'); g.addColorStop(1,'#4a4a8e');
      ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

      ctx.save();
      ctx.translate(-st.camX, 0);

      for(const pl of st.platforms){
        if(pl.x + pl.w < st.camX || pl.x > st.camX + W) continue;
        ctx.fillStyle = '#8B4513'; ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
        ctx.fillStyle = '#A0522D'; ctx.fillRect(pl.x, pl.y, pl.w, 5);
      }

      for(const e of st.enemies){
        if(e.x + e.w < st.camX || e.x > st.camX + W) continue;
        ctx.fillStyle = '#ff3366'; ctx.fillRect(e.x, e.y, e.w, e.h);
        ctx.fillStyle = '#fff'; ctx.fillRect(e.x+5,e.y+8,8,8); ctx.fillRect(e.x+17,e.y+8,8,8);
        ctx.fillStyle = '#000'; ctx.fillRect(e.x+7,e.y+10,4,4); ctx.fillRect(e.x+19,e.y+10,4,4);
      }

      if(!st.princess.gone){
        ctx.fillStyle = '#ff88cc'; ctx.fillRect(st.princess.x, st.princess.y, 25, 40);
        ctx.fillStyle = '#ffcc00'; ctx.fillRect(st.princess.x+5, st.princess.y-10, 15, 15);
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.moveTo(st.princess.x,     st.princess.y-15);
        ctx.lineTo(st.princess.x+7,   st.princess.y-27);
        ctx.lineTo(st.princess.x+12,  st.princess.y-15);
        ctx.lineTo(st.princess.x+17,  st.princess.y-27);
        ctx.lineTo(st.princess.x+24,  st.princess.y-15);
        ctx.fill();
      }

      ctx.save();
      ctx.translate(st.p.x + 10, st.p.y + 15);
      ctx.scale(st.p.facing, 1);
      let img = A.still;
      if(st.p.mode === 'walk' && A.walk[st.p.anim]) img = A.walk[st.p.anim];
      else if(st.p.mode === 'jump' && A.jump[st.p.anim]) img = A.jump[st.p.anim];
      else if(st.p.mode === 'fall' && A.fall[st.p.anim]) img = A.fall[st.p.anim];
      if(st.hurtF > 0 && A.hurt) img = A.hurt;
      if(st.invuln > 0 && Math.floor(st.time*10)%2 === 0) ctx.globalAlpha = 0.4;
      if(img) ctx.drawImage(img, -15, -15, 30, 30);
      else {
        ctx.fillStyle = st.hurtF>0 ? '#ff3366' : '#00d4ff';
        ctx.fillRect(-15,-15,30,30);
      }
      ctx.restore();
      ctx.restore();

      const prog = Math.min(1, st.p.x / 2280);
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(20, 18, W-40, 8);
      ctx.fillStyle = '#00ff88'; ctx.fillRect(20, 18, (W-40)*prog, 8);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 11px Courier New'; ctx.textAlign = 'center';
      ctx.fillText('ROAD TO HAPPINESS', W/2, 14);

      if(st.hurtF > 0){
        ctx.fillStyle = `rgba(255,0,0,${st.hurtF*0.3})`;
        ctx.fillRect(0,0,W,H);
      }

      if(st.ended){
        ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0,0,W,H);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Courier New'; ctx.textAlign = 'center';
        ctx.fillText("She's gone... Happiness slipped away.", W/2, H/2);
        ctx.fillStyle = '#ff88cc'; ctx.font = '13px Courier New';
        ctx.fillText("But you'll find her again.", W/2, H/2 + 26);
      }
    },
    destroy(){
      document.removeEventListener('keydown', onKD);
      document.removeEventListener('keyup', onKU);
      canvas.removeEventListener('pointerdown', onTap);
    }
  };
}

// ============ LEVEL 3: SNAKE ============
function Level3(){
  const GRID = 20, COLS = W/GRID, ROWS = (H-60)/GRID;
  const st = {
    snake:[{x:8,y:10},{x:7,y:10},{x:6,y:10}],
    dir:{x:1,y:0}, nextDir:{x:1,y:0},
    food:{x:15,y:10}, speed:7, moveT:0, collected:0, flash:0,
    keys:{left:false,right:false,up:false,down:false,jump:false}
  };
  function spawnFood(){
    let f, guard = 0;
    do{
      f = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) };
      guard++;
    } while(st.snake.some(s=>s.x===f.x && s.y===f.y) && guard < 200);
    st.food = f;
  }
  function setDir(dx,dy){
    // Check current dir — prevents 180° into self
    if(st.dir.x === -dx && st.dir.y === -dy) return;
    st.nextDir = { x:dx, y:dy };
  }
  const onKey = (e)=>{
    if(G.screen !== 'playing') return;
    if(e.key==='ArrowUp'||e.key==='w')    setDir(0,-1);
    if(e.key==='ArrowDown'||e.key==='s')  setDir(0,1);
    if(e.key==='ArrowLeft'||e.key==='a')  setDir(-1,0);
    if(e.key==='ArrowRight'||e.key==='d') setDir(1,0);
  };
  let startX=0, startY=0, tracking=false;
  const onDown = (e)=>{ if(G.screen!=='playing') return; tracking = true; startX = e.clientX; startY = e.clientY; };
  // BUG #6 FIX: pointerup on document to catch drags off canvas
  const onUp = (e)=>{
    if(!tracking) return;
    tracking = false;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if(Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
    if(Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
  };

  return {
    keys: st.keys,
    init(){
      spawnFood();
      document.addEventListener('keydown', onKey);
      canvas.addEventListener('pointerdown', onDown);
      document.addEventListener('pointerup', onUp);
    },
    update(dt){
      if(G.screen !== 'playing') return;
      st.flash = Math.max(0, st.flash - dt*3);
      st.moveT += dt;
      if(st.moveT < 1/st.speed) return;
      st.moveT = 0;
      st.dir = { ...st.nextDir };

      const head = { x: st.snake[0].x + st.dir.x, y: st.snake[0].y + st.dir.y };
      head.x = (head.x + COLS) % COLS;
      head.y = (head.y + ROWS) % ROWS;

      if(st.snake.some(s=>s.x===head.x && s.y===head.y)){
        st.flash = 1;
        if(loseLife()) return;
        st.snake = [{x:8,y:10},{x:7,y:10},{x:6,y:10}];
        st.dir = {x:1,y:0}; st.nextDir = {x:1,y:0};
        // Ensure food isn't on new snake
        if(st.snake.some(s=>s.x===st.food.x && s.y===st.food.y)) spawnFood();
        return;
      }
      st.snake.unshift(head);
      if(head.x === st.food.x && head.y === st.food.y){
        st.collected++;
        if(st.speed < 14) st.speed += 0.4;
        spawnFood();
        if(st.collected >= 7 && !wonThisSession) completeLevel();
      } else {
        st.snake.pop();
      }
    },
    draw(ctx){
      ctx.fillStyle = '#0a0a1a'; ctx.fillRect(0,0,W,H);

      ctx.strokeStyle = 'rgba(0,255,0,0.06)'; ctx.lineWidth = 1;
      for(let x=0;x<=COLS;x++){ ctx.beginPath(); ctx.moveTo(x*GRID,60); ctx.lineTo(x*GRID,H); ctx.stroke(); }
      for(let y=0;y<=ROWS;y++){ ctx.beginPath(); ctx.moveTo(0,60+y*GRID); ctx.lineTo(W,60+y*GRID); ctx.stroke(); }

      for(let i=st.snake.length-1;i>=0;i--){
        const s = st.snake[i];
        const a = 1 - (i/st.snake.length)*0.55;
        ctx.fillStyle = i===0 ? '#00ff00' : `rgba(0,255,0,${a})`;
        ctx.fillRect(s.x*GRID+2, 60+s.y*GRID+2, GRID-4, GRID-4);
      }
      const h = st.snake[0];
      if(A.still){
        ctx.save();
        ctx.beginPath(); ctx.rect(h.x*GRID, 60+h.y*GRID, GRID, GRID); ctx.clip();
        ctx.drawImage(A.still, h.x*GRID, 60+h.y*GRID, GRID, GRID);
        ctx.restore();
      }

      ctx.fillStyle = '#00ccff';
      ctx.fillRect(st.food.x*GRID+2, 60+st.food.y*GRID+2, GRID-4, GRID-4);

      ctx.fillStyle = '#00ff00'; ctx.font = 'bold 15px Courier New'; ctx.textAlign = 'left';
      ctx.fillText(`Laptops: ${Math.min(7, st.collected)}/7`, 12, 24);
      ctx.fillStyle = '#666'; ctx.font = '11px Courier New'; ctx.textAlign = 'center';
      ctx.fillText('Swipe or arrow keys', W/2, 52);

      if(st.flash > 0){
        ctx.fillStyle = `rgba(255,0,0,${st.flash*0.35})`;
        ctx.fillRect(0,0,W,H);
      }
    },
    destroy(){
      document.removeEventListener('keydown', onKey);
      canvas.removeEventListener('pointerdown', onDown);
      document.removeEventListener('pointerup', onUp);
    }
  };
}

// ============ LEVEL 4: DANCE (2-min cap) ============
function Level4(){
  const SPEED = 210, HIT_Y = H-90, SONG_LIMIT = 120;
  const st = {
    arrows:[], score:0, elapsed:0, spawnT:0, time:0,
    hurtF:0, ended:false,
    keys:{left:false,right:false,up:false,down:false,jump:false}
  };
  function hitSide(side){
    if(st.ended || G.screen !== 'playing') return;
    let best = null, bestD = Infinity;
    for(const a of st.arrows){
      if(a.hit || a.side !== side) continue;
      const d = Math.abs(a.y - HIT_Y);
      if(d < bestD){ bestD = d; best = a; }
    }
    if(best && bestD < 75){
      best.hit = true;
      st.score++;
      if(st.score >= 7 && !wonThisSession){ st.ended = true; completeLevel(); }
    }
  }
  const onKey = (e)=>{
    if(G.screen !== 'playing') return;
    if(e.key==='ArrowLeft'||e.key==='a'){ e.preventDefault(); hitSide('L'); }
    if(e.key==='ArrowRight'||e.key==='d'){ e.preventDefault(); hitSide('R'); }
  };
  let touchX = null;
  const onDown = (e)=>{ if(G.screen!=='playing') return; touchX = e.clientX; };
  // BUG #6 FIX: document pointerup
  const onUp = (e)=>{
    if(touchX === null) return;
    const rect = canvas.getBoundingClientRect();
    const rel = (touchX - rect.left) / rect.width;
    touchX = null;
    hitSide(rel < 0.5 ? 'L' : 'R');
  };

  return {
    keys: st.keys,
    init(){
      document.addEventListener('keydown', onKey);
      canvas.addEventListener('pointerdown', onDown);
      document.addEventListener('pointerup', onUp);
    },
    update(dt){
      if(G.screen !== 'playing' || st.ended) return;
      st.time += dt;
      st.elapsed += dt;
      st.hurtF = Math.max(0, st.hurtF - dt*3);

      if(st.elapsed >= SONG_LIMIT && !wonThisSession){
        st.ended = true;
        completeLevel();
        return;
      }

      st.spawnT += dt;
      if(st.spawnT > 0.95){
        st.spawnT = 0;
        st.arrows.push({ side: Math.random() < 0.5 ? 'L' : 'R', y:-40, hit:false, missed:false });
      }

      for(let i=st.arrows.length-1; i>=0; i--){
        const a = st.arrows[i];
        a.y += SPEED*dt;
        if(!a.hit && !a.missed && a.y > HIT_Y + 40){
          a.missed = true;
          st.hurtF = 1;
          if(loseLife()){ st.ended = true; return; }
        }
        if(a.y > H + 60) st.arrows.splice(i,1);
      }
    },
    draw(ctx){
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'#1a0a2e'); g.addColorStop(.5,'#2a1a4e'); g.addColorStop(1,'#3a2a6e');
      ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

      ctx.strokeStyle = 'rgba(255,0,255,.12)'; ctx.lineWidth = 1;
      for(let i=0;i<12;i++){
        ctx.beginPath(); ctx.moveTo(0, H-i*18); ctx.lineTo(W, H-i*18); ctx.stroke();
      }

      ctx.fillStyle = 'rgba(0,212,255,.08)'; ctx.fillRect(0, HIT_Y-50, W, 100);
      ctx.strokeStyle = '#00d4ff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, HIT_Y); ctx.lineTo(W, HIT_Y); ctx.stroke();

      ctx.fillStyle = 'rgba(255,51,102,.55)'; ctx.font = 'bold 13px Courier New'; ctx.textAlign = 'center';
      ctx.fillText('◀ LEFT', W/4, HIT_Y + 32);
      ctx.fillStyle = 'rgba(0,212,255,.55)';
      ctx.fillText('RIGHT ▶', W*3/4, HIT_Y + 32);

      for(const a of st.arrows){
        const x = a.side === 'L' ? W/4 : W*3/4;
        ctx.save();
        ctx.translate(x, a.y);
        if(a.hit) ctx.globalAlpha = 0.25;
        ctx.fillStyle = a.side === 'L' ? '#ff3366' : '#00d4ff';
        ctx.beginPath();
        if(a.side === 'L'){
          ctx.moveTo(22,0); ctx.lineTo(-12,-16); ctx.lineTo(-12,-6);
          ctx.lineTo(-28,-6); ctx.lineTo(-28,6); ctx.lineTo(-12,6); ctx.lineTo(-12,16);
        } else {
          ctx.moveTo(-22,0); ctx.lineTo(12,-16); ctx.lineTo(12,-6);
          ctx.lineTo(28,-6); ctx.lineTo(28,6); ctx.lineTo(12,6); ctx.lineTo(12,16);
        }
        ctx.fill();
        ctx.restore();
      }

      ctx.save();
      ctx.translate(W/2, H-230);
      ctx.translate(0, Math.sin(st.time*8)*5);
      if(A.still) ctx.drawImage(A.still, -28, -28, 56, 56);
      ctx.restore();

      ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Courier New'; ctx.textAlign = 'center';
      ctx.fillText(`Dance: ${Math.min(7, st.score)}/7`, W/2, 42);
      const songPct = Math.min(1, st.elapsed / SONG_LIMIT);
      ctx.fillStyle = 'rgba(255,255,255,.15)';
      ctx.fillRect(60, 56, W-120, 6);
      ctx.fillStyle = '#ffcc00';
      ctx.fillRect(60, 56, (W-120)*songPct, 6);
      ctx.fillStyle = '#888'; ctx.font = '11px Courier New';
      const rem = Math.max(0, SONG_LIMIT - st.elapsed);
      ctx.fillText(`♪ ${Math.floor(rem/60)}:${String(Math.floor(rem%60)).padStart(2,'0')}`, W/2, 78);

      if(st.hurtF > 0){
        ctx.fillStyle = `rgba(255,0,0,${st.hurtF*0.3})`;
        ctx.fillRect(0,0,W,H);
      }
    },
    destroy(){
      document.removeEventListener('keydown', onKey);
      canvas.removeEventListener('pointerdown', onDown);
      document.removeEventListener('pointerup', onUp);
    }
  };
}

// ============ LEVEL 5: LOTTERY ============
function Level5(){
  const SYMS = ['🍊','7','🍃'];
  const st = {
    spins:0, reel:['🍊','7','🍃'], spinning:false, spinT:0, ended:false,
    message:'Tap SPIN!',
    keys:{left:false,right:false,up:false,down:false,jump:false}
  };
  function spin(){
    // BUG #7 FIX: re-check screen + ended
    if(G.screen !== 'playing') return;
    if(st.spinning || st.spins >= 7 || st.ended) return;
    st.spinning = true; st.spinT = 0; st.message = 'Spinning…';
  }
  const onKey = (e)=>{ if(G.screen !== 'playing') return; if(e.key===' '||e.key==='Enter'){ e.preventDefault(); spin(); } };
  const onTap = (e)=>{ e.preventDefault(); spin(); };

  return {
    keys: st.keys,
    init(){
      document.addEventListener('keydown', onKey);
      canvas.addEventListener('pointerdown', onTap);
    },
    update(dt){
      if(G.screen !== 'playing' || !st.spinning) return;
      st.spinT += dt;
      if(st.spinT < 1.8){
        if(Math.floor(st.spinT*20)%2 === 0){
          st.reel = [SYMS[Math.random()*3|0], SYMS[Math.random()*3|0], SYMS[Math.random()*3|0]];
        }
      } else {
        st.spinning = false;
        st.spins++;
        if(st.spins === 7){
          st.reel = ['7','7','7'];
          st.message = '🎉 777! JACKPOT! 🎉';
          st.ended = true;
          setTimeout(()=>{ if(G.screen==='playing' && !wonThisSession) completeLevel(); }, 1400);
        } else {
          st.reel = [SYMS[Math.random()*3|0], SYMS[Math.random()*3|0], SYMS[Math.random()*3|0]];
          if(st.reel[0]==='7' && st.reel[1]==='7' && st.reel[2]==='7'){
            st.message = '🎉 777! JACKPOT! 🎉';
            st.ended = true;
            setTimeout(()=>{ if(G.screen==='playing' && !wonThisSession) completeLevel(); }, 1400);
          } else {
            st.message = `Spin ${st.spins}/7 — try again`;
          }
        }
      }
    },
    draw(ctx){
      const g = ctx.createRadialGradient(W/2, H/2, 40, W/2, H/2, 400);
      g.addColorStop(0,'#2a0a0a'); g.addColorStop(1,'#0a0a1a');
      ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

      const fx = W/2 - 130, fy = H/2 - 110;
      ctx.save(); ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 22;
      ctx.fillStyle = '#ffcc00'; ctx.fillRect(fx-10, fy-10, 280, 230);
      ctx.restore();
      ctx.fillStyle = '#1a1a2e'; ctx.fillRect(fx, fy, 260, 210);

      for(let i=0;i<3;i++){
        const rx = fx + 20 + i*80;
        ctx.fillStyle = '#0a0a1a'; ctx.fillRect(rx, fy+20, 65, 130);
        ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 1; ctx.strokeRect(rx, fy+20, 65, 130);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 42px Courier New'; ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(st.reel[i], rx + 32, fy + 85);
      }
      ctx.textBaseline = 'alphabetic';

      ctx.fillStyle = '#fff'; ctx.font = 'bold 15px Courier New'; ctx.textAlign = 'center';
      ctx.fillText(st.message, W/2, fy + 180);

      for(let i=0;i<7;i++){
        const dx = W/2 - 84 + i*28;
        ctx.beginPath(); ctx.arc(dx, fy + 212, 7, 0, Math.PI*2);
        ctx.fillStyle = i < st.spins ? '#00ff88' : '#333';
        ctx.fill();
      }

      if(A.still) ctx.drawImage(A.still, W/2-25, H-150, 50, 50);

      if(!st.spinning && st.spins < 7 && !st.ended){
        ctx.save(); ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 16;
        ctx.fillStyle = '#00ff88'; ctx.fillRect(W/2-70, H-80, 140, 46);
        ctx.restore();
        ctx.fillStyle = '#0a0a1a'; ctx.font = 'bold 20px Courier New';
        ctx.fillText('SPIN', W/2, H-50);
      }

      ctx.fillStyle = '#666'; ctx.font = '11px Courier New';
      ctx.fillText('Tap or press SPACE', W/2, H-12);
    },
    destroy(){
      document.removeEventListener('keydown', onKey);
      canvas.removeEventListener('pointerdown', onTap);
    }
  };
}

// ============ LEVEL 6: BOAT ============
function Level6(){
  const SPEED = 165, AUTO = 45;
  const st = {
    boat:{ x:W/2, y:H-80 },
    streams:[], obstacles:[],
    invuln:0, hurtF:0, time:0, ended:false,
    keys:{left:false,right:false,up:false,down:false,jump:false}
  };
  for(let i=0;i<7;i++){
    st.streams.push({
      y: H - 100 - i*72,
      dir: i%2===0 ? 1 : -1,
      speed: 90 + i*22,
      spawnT: 0,
      interval: Math.max(0.5, 1.15 - i*0.09)
    });
  }

  const onKD = (e)=>{
    if(G.screen !== 'playing') return;
    if(e.key==='ArrowLeft'||e.key==='a') st.keys.left = true;
    if(e.key==='ArrowRight'||e.key==='d') st.keys.right = true;
    if(e.key==='ArrowUp'||e.key==='w') st.keys.up = true;
    if(e.key==='ArrowDown'||e.key==='s') st.keys.down = true;
  };
  const onKU = (e)=>{
    if(e.key==='ArrowLeft'||e.key==='a') st.keys.left = false;
    if(e.key==='ArrowRight'||e.key==='d') st.keys.right = false;
    if(e.key==='ArrowUp'||e.key==='w') st.keys.up = false;
    if(e.key==='ArrowDown'||e.key==='s') st.keys.down = false;
  };

  return {
    keys: st.keys,
    init(){
      document.addEventListener('keydown', onKD);
      document.addEventListener('keyup', onKU);
    },
    update(dt){
      if(G.screen !== 'playing' || st.ended) return;
      st.time += dt;
      st.invuln = Math.max(0, st.invuln - dt);
      st.hurtF = Math.max(0, st.hurtF - dt*3);

      if(st.keys.left)  st.boat.x -= SPEED*dt;
      if(st.keys.right) st.boat.x += SPEED*dt;
      if(st.keys.up)    st.boat.y -= SPEED*dt;
      if(st.keys.down)  st.boat.y += SPEED*dt;
      st.boat.y -= AUTO*dt;
      st.boat.x = Math.max(20, Math.min(W-20, st.boat.x));
      st.boat.y = Math.max(50, Math.min(H-40, st.boat.y));

      for(const s of st.streams){
        s.spawnT += dt;
        if(s.spawnT > s.interval){
          s.spawnT = 0;
          st.obstacles.push({
            x: s.dir > 0 ? -30 : W+30,
            y: s.y + 12, w:32, h:32,
            vx: s.dir * s.speed
          });
        }
      }
      for(let i=st.obstacles.length-1; i>=0; i--){
        const o = st.obstacles[i];
        o.x += o.vx*dt;
        if(o.x < -60 || o.x > W+60) st.obstacles.splice(i,1);
      }

      if(st.invuln <= 0){
        for(const o of st.obstacles){
          if(st.boat.x+14 > o.x && st.boat.x-14 < o.x+o.w && st.boat.y+12 > o.y && st.boat.y-12 < o.y+o.h){
            st.hurtF = 1; st.invuln = 1.4;
            if(loseLife()){ st.ended = true; return; }
            st.boat.y = Math.min(H-40, st.boat.y + 60);
            break;
          }
        }
      }

      if(st.boat.y < 60){
        st.ended = true;
        if(!wonThisSession) completeLevel();
      }
    },
    draw(ctx){
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'#0a2a4a'); g.addColorStop(1,'#0a4a6a');
      ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

      for(const s of st.streams){
        ctx.fillStyle = 'rgba(0,100,200,.28)';
        ctx.fillRect(0, s.y, W, 60);
        ctx.strokeStyle = 'rgba(0,200,255,.35)'; ctx.lineWidth = 1;
        for(let x=0;x<W;x+=24){
          const yy = s.y + 12 + Math.sin((x + st.time*100*s.dir*0.05) * 0.1) * 3;
          ctx.beginPath(); ctx.moveTo(x,yy); ctx.lineTo(x+24,yy); ctx.stroke();
        }
      }

      const fg = ctx.createLinearGradient(0,0,0,60);
      fg.addColorStop(0,'#00ff88'); fg.addColorStop(1,'rgba(0,255,136,.2)');
      ctx.fillStyle = fg; ctx.fillRect(0,0,W,60);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'center';
      ctx.fillText('🌿 FIELD OF HAPPINESS 🌿', W/2, 24);

      for(const o of st.obstacles){
        ctx.fillStyle = '#ff3366'; ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.fillStyle = '#990022'; ctx.fillRect(o.x+6, o.y+6, o.w-12, o.h-12);
        ctx.fillStyle = '#fff';
        ctx.fillRect(o.x+8, o.y+12, 6, 6); ctx.fillRect(o.x+18, o.y+12, 6, 6);
      }

      ctx.save();
      ctx.translate(st.boat.x, st.boat.y);
      if(st.invuln > 0 && Math.floor(st.time*10)%2 === 0) ctx.globalAlpha = 0.5;
      ctx.fillStyle = '#8B4513';
      ctx.beginPath();
      ctx.moveTo(-22,12); ctx.lineTo(-16,-10); ctx.lineTo(16,-10); ctx.lineTo(22,12);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#A0522D'; ctx.fillRect(-16, -10, 32, 6);
      const img = (st.hurtF > 0 && A.hurt) ? A.hurt : A.still;
      if(img) ctx.drawImage(img, -13, -30, 26, 26);
      ctx.restore();

      const p = Math.min(1, 1 - (st.boat.y - 50)/(H - 90));
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(W-180, 76, 168, 10);
      ctx.fillStyle = '#00ff88'; ctx.fillRect(W-180, 76, 168*p, 10);

      if(st.hurtF > 0){
        ctx.fillStyle = `rgba(255,0,0,${st.hurtF*0.3})`;
        ctx.fillRect(0,0,W,H);
      }
    },
    destroy(){
      document.removeEventListener('keydown', onKD);
      document.removeEventListener('keyup', onKU);
    }
  };
}

// ============ LEVEL 7: STORY ============
function Level7(){
  const st = {
    picked:false, showMsg:false, msgAlpha:0, fadeA:1,
    ended:false, fallback:null, hardCap:null, audio:null, onEndHandler:null,
    keys:{left:false,right:false,up:false,down:false,jump:false}
  };
  function finish(){
    if(st.ended) return;
    st.ended = true;
    if(st.fallback) clearTimeout(st.fallback);
    if(st.hardCap) clearTimeout(st.hardCap);
    showFinalEnd();
  }
  function pick(){
    if(st.picked || st.ended) return;
    st.picked = true;
    st.showMsg = true;

    const a = A.music['l7'];
    if(!a){ st.fallback = setTimeout(finish, 8000); return; }
    // BUG #3 FIX: don't stop all music — just play l7 (was already stopped by startLevel for idx 6)
    try{
      a.loop = false;
      a.currentTime = 0;
      st.audio = a;
      st.onEndHandler = ()=>{ a.removeEventListener('ended', st.onEndHandler); finish(); };
      a.addEventListener('ended', st.onEndHandler);
      const p = a.play();
      if(p && p.catch) p.catch(()=>{ st.fallback = setTimeout(finish, 5000); });
    }catch(e){ st.fallback = setTimeout(finish, 5000); }

    // BUG #4/#5 FIX: hard cap 5 min in case 'ended' never fires
    st.hardCap = setTimeout(finish, 300000);
  }
  const onKey = (e)=>{ if(G.screen !== 'playing') return; if(e.key===' '||e.key==='Enter'){ e.preventDefault(); pick(); } };
  const onTap = (e)=>{ e.preventDefault(); pick(); };

  return {
    keys: st.keys,
    init(){
      document.addEventListener('keydown', onKey);
      canvas.addEventListener('pointerdown', onTap);
    },
    update(dt){
      if(G.screen !== 'playing' || st.ended) return;
      if(st.fadeA > 0) st.fadeA = Math.max(0, st.fadeA - dt*0.6);
      if(st.showMsg) st.msgAlpha = Math.min(1, st.msgAlpha + dt*1.3);
    },
    draw(ctx){
      ctx.fillStyle = '#1a1a3e'; ctx.fillRect(0,0,W,H);

      ctx.fillStyle = '#0a0a2a'; ctx.fillRect(W-160, 50, 110, 110);
      ctx.strokeStyle = '#333'; ctx.lineWidth = 3; ctx.strokeRect(W-160, 50, 110, 110);
      ctx.beginPath(); ctx.moveTo(W-105, 50); ctx.lineTo(W-105, 160); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(W-160, 105); ctx.lineTo(W-50, 105); ctx.stroke();
      ctx.fillStyle = '#ffcc00';
      ctx.beginPath(); ctx.arc(W-115, 85, 18, 0, Math.PI*2); ctx.fill();

      ctx.fillStyle = '#fff';
      for(let i=0;i<24;i++) ctx.fillRect((i*47)%W, (i*63)%220, 2, 2);

      ctx.fillStyle = '#8B4513'; ctx.fillRect(50, H-170, 220, 30);
      ctx.fillStyle = '#4a90d9'; ctx.fillRect(60, H-200, 200, 40);
      ctx.fillStyle = '#fff'; ctx.fillRect(60, H-210, 60, 20);

      if(A.still){
        ctx.save();
        ctx.translate(150, H-180);
        ctx.rotate(0.25);
        ctx.drawImage(A.still, -22, -22, 44, 44);
        ctx.restore();
      }

      ctx.fillStyle = '#333'; ctx.fillRect(W-90, H-110, 40, 65);
      ctx.fillStyle = '#111'; ctx.fillRect(W-86, H-106, 32, 52);

      if(!st.picked){
        const glow = 0.35 + Math.abs(Math.sin(Date.now()/400))*0.4;
        ctx.save();
        ctx.shadowColor = '#00d4ff'; ctx.shadowBlur = 22*glow;
        ctx.fillStyle = `rgba(0,212,255,${glow})`;
        ctx.beginPath(); ctx.arc(W-70, H-78, 26, 0, Math.PI*2); ctx.fill();
        ctx.restore();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 22px Courier New'; ctx.textAlign = 'center';
        ctx.fillText('📱', W-70, H-70);
        const h = 0.5 + Math.sin(Date.now()/500)*0.4;
        ctx.fillStyle = `rgba(255,255,255,${h})`; ctx.font = 'bold 15px Courier New';
        ctx.fillText('Tap the glowing phone', W/2, H-30);
      }

      if(st.picked){
        const a = st.msgAlpha;
        ctx.globalAlpha = a;
        ctx.fillStyle = 'rgba(0,0,0,.85)';
        ctx.fillRect(40, 140, W-80, 320);
        ctx.strokeStyle = '#00d4ff'; ctx.lineWidth = 2;
        ctx.strokeRect(40, 140, W-80, 320);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 22px Courier New';
        ctx.fillText('22nd September', W/2, 200);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Courier New';
        ctx.fillText('Shoptorshee Day', W/2, 245);
        ctx.fillStyle = '#00ff88'; ctx.font = 'bold 24px Courier New';
        ctx.fillText('I wish you', W/2, 305);
        ctx.fillText('Happiness', W/2, 340);
        ctx.fillStyle = '#888'; ctx.font = '13px Courier New';
        ctx.fillText('♪ listening ♪', W/2, 420);
        ctx.globalAlpha = 1;
      }

      if(st.fadeA > 0){
        ctx.fillStyle = `rgba(0,0,0,${st.fadeA})`;
        ctx.fillRect(0,0,W,H);
      }
    },
    destroy(){
      document.removeEventListener('keydown', onKey);
      canvas.removeEventListener('pointerdown', onTap);
      // BUG #4 FIX: cancel audio listener + timers so no stray 'ended' fires after leaving
      if(st.onEndHandler && st.audio){
        try{ st.audio.removeEventListener('ended', st.onEndHandler); }catch(e){}
      }
      if(st.fallback) clearTimeout(st.fallback);
      if(st.hardCap) clearTimeout(st.hardCap);
      if(st.audio){ try{ st.audio.pause(); st.audio.currentTime = 0; }catch(e){} }
      st.ended = true;
    }
  };
}

// ============ FACTORY TABLE ============
const LEVEL_FACTORIES = [Level1, Level2, Level3, Level4, Level5, Level6, Level7];

// ============ BOOT ============
(async function boot(){
  showLoading();
  try{
    await loadAssets();
  }catch(e){ console.error('asset load failed', e); }
  showMenu();
})();
</script>
