<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Shoptorshi Game</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;overflow:hidden;background:#1a1040;font-family:'Courier New',monospace;touch-action:none;overscroll-behavior:none}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#1a1040;border:3px solid #7b68ee;box-shadow:0 0 30px rgba(123,104,238,.5),inset 0 0 60px rgba(26,16,64,.8);position:relative;z-index:1}
  #hud{position:absolute;top:0;left:0;right:0;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:5;color:#fff;font-size:15px;font-weight:bold;text-shadow:2px 2px 0 #1a1040}
  #hud.hidden{display:none}
  #hud-pts{color:#ffd700;text-shadow:2px 2px 0 #1a1040,0 0 8px #ffd700}
  #hud-lives{color:#ff6688;text-shadow:2px 2px 0 #1a1040,0 0 8px #ff6688}
  #hud-menu{pointer-events:auto;background:rgba(123,104,238,.3);border:2px solid #7b68ee;color:#e0d8ff;font-family:inherit;font-size:12px;font-weight:bold;padding:6px 12px;border-radius:6px;cursor:pointer;letter-spacing:1px;text-shadow:1px 1px 0 #1a1040}
  #hud-menu:active{background:rgba(123,104,238,.7);color:#fff}
  #touch{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px;pointer-events:none;z-index:6}
  #touch.hidden{display:none}
  .dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;pointer-events:none}
  .btn{pointer-events:auto;display:flex;align-items:center;justify-content:center;background:rgba(123,104,238,.25);border:2px solid rgba(123,104,238,.8);color:#e0d8ff;font-size:18px;font-weight:bold;border-radius:10px;font-family:inherit;touch-action:none;text-shadow:1px 1px 0 #1a1040}
  .btn.active{background:rgba(123,104,238,.8);color:#fff}
  .dpad .btn[data-k="up"]{grid-column:2;grid-row:1}
  .dpad .btn[data-k="left"]{grid-column:1;grid-row:2}
  .dpad .btn[data-k="right"]{grid-column:3;grid-row:2}
  .dpad .btn[data-k="down"]{grid-column:2;grid-row:3}
  #jump-btn{width:86px;height:86px;border-radius:50%;font-size:13px;background:rgba(100,255,180,.2);border-color:rgba(100,255,180,.8);color:#64ffb4;letter-spacing:1px;text-shadow:1px 1px 0 #1a1040}
  #jump-btn.active{background:rgba(100,255,180,.7);color:#1a1040}
  #river-controls{position:absolute;right:18px;bottom:18px;display:flex;flex-direction:column;gap:14px;z-index:7;pointer-events:none}
  #river-controls.hidden{display:none}
  .river-btn{pointer-events:auto;width:96px;height:96px;border-radius:50%;background:rgba(123,104,238,.3);border:3px solid rgba(123,104,238,.9);color:#fff;font-size:44px;font-weight:bold;font-family:inherit;touch-action:none;display:flex;align-items:center;justify-content:center;text-shadow:2px 2px 4px #1a1040;box-shadow:0 0 18px rgba(123,104,238,.5)}
  .river-btn.active{background:rgba(123,104,238,.85);transform:scale(.94)}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(26,16,64,.96);color:#fff;text-align:center;padding:20px;z-index:10;overflow-y:auto}
  #overlay.hidden{display:none}
  #overlay h1{color:#ffd700;font-size:2em;letter-spacing:4px;margin-bottom:6px;text-shadow:3px 3px 0 #1a1040,0 0 20px #ffd700}
  #overlay h2{color:#64ffb4;font-size:1.5em;margin-bottom:10px;text-shadow:3px 3px 0 #1a1040,0 0 16px #64ffb4}
  #overlay h2.bad{color:#ff6688;text-shadow:3px 3px 0 #1a1040,0 0 16px #ff6688}
  #overlay p{color:#b8a8e8;font-size:.9em;margin-bottom:16px;line-height:1.5}
  .hearts{display:flex;gap:8px;margin-bottom:18px}
  .heart{width:26px;height:26px;background:#ff6688;clip-path:polygon(50% 100%,0 35%,15% 0,50% 20%,85% 0,100% 35%);animation:p 1s infinite alternate}
  .heart:nth-child(2){animation-delay:.1s}.heart:nth-child(3){animation-delay:.2s}
  .heart:nth-child(4){animation-delay:.3s}.heart:nth-child(5){animation-delay:.4s}
  .heart:nth-child(6){animation-delay:.5s}.heart:nth-child(7){animation-delay:.6s}
  @keyframes p{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.18);opacity:1}}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:440px;width:100%;margin-top:8px}
  .lvl{aspect-ratio:1;background:#2a1a5e;border:3px solid #7b68ee;color:#e0d8ff;font-size:1.4em;font-weight:bold;display:flex;align-items:center;justify-content:center;border-radius:10px;position:relative;cursor:pointer;font-family:inherit;flex-direction:column;box-shadow:0 4px 0 #1a1040;text-shadow:1px 1px 0 #1a1040}
  .lvl:active{transform:translateY(3px);box-shadow:0 1px 0 #1a1040}
  .lvl.locked{border-color:#3a2a6e;color:#3a2a6e;cursor:default;box-shadow:0 4px 0 #0f0a2a}
  .lvl.locked::after{content:'🔒';position:absolute;font-size:1em}
  .lvl.done{border-color:#64ffb4;color:#64ffb4;box-shadow:0 4px 0 #1a1040,0 0 12px rgba(100,255,180,.5)}
  .lvl small{position:absolute;bottom:4px;font-size:9px;color:#8878b8;font-weight:normal}
  .lvl .icon{font-size:.9em;line-height:1}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .obtn{padding:12px 22px;border:none;border-radius:8px;font-family:inherit;font-size:14px;font-weight:bold;letter-spacing:1px;cursor:pointer;color:#1a1040;background:#7b68ee;box-shadow:0 4px 0 #4a3a8e;text-shadow:1px 1px 0 rgba(255,255,255,.2)}
  .obtn.green{background:#64ffb4;box-shadow:0 4px 0 #2a8e5e}
  .obtn.yellow{background:#ffd700;box-shadow:0 4px 0 #8e7a00}
  .obtn.red{background:#ff6688;color:#fff;box-shadow:0 4px 0 #8e2a4a}
  .obtn:active{transform:translateY(3px);box-shadow:0 1px 0 #4a3a8e}
  .bar{width:220px;height:8px;background:#2a1a5e;border-radius:4px;overflow:hidden;margin-top:20px;border:2px solid #7b68ee}
  .bar>div{height:100%;width:0;background:linear-gradient(90deg,#7b68ee,#ffd700);transition:width .3s}
  .vol-warn{color:#ffd700;font-size:1.1em;margin:14px 0;animation:blink 1.2s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
  .speaker{font-size:3em;margin-bottom:12px;animation:shake .6s infinite}
  @keyframes shake{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  .music-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px;max-width:460px}
  .music-btn{padding:8px 14px;border:2px solid #7b68ee;background:rgba(123,104,238,.2);color:#e0d8ff;border-radius:6px;font-family:inherit;font-size:12px;font-weight:bold;cursor:pointer;letter-spacing:1px}
  .music-btn.playing{background:#ffd700;color:#1a1040;border-color:#ffd700;box-shadow:0 0 12px #ffd700}
  .music-btn:active{transform:scale(.95)}
</style>
</head>
<body>
<div id="app">
  <canvas id="c" width="480" height="640"></canvas>
  <div id="hud" class="hidden">
    <span id="hud-pts">★ 0</span>
    <button id="hud-menu">MENU</button>
    <span id="hud-lives">❤ 7</span>
  </div>
  <div id="touch" class="hidden">
    <div class="dpad">
      <div class="btn" data-k="up">▲</div>
      <div class="btn" data-k="left">◀</div>
      <div class="btn" data-k="right">▶</div>
      <div class="btn" data-k="down">▼</div>
    </div>
    <div class="btn" id="jump-btn" data-k="jump">JUMP</div>
  </div>
  <div id="river-controls" class="hidden">
    <button class="river-btn" id="river-up">▲</button>
    <button class="river-btn" id="river-down">▼</button>
  </div>
  <div id="overlay"></div>
</div>

<script>
'use strict';
// ============================================================
// CONSTANTS
// ============================================================
const W = 480, H = 640;
const API = 'https://script.google.com/macros/s/AKfycbyiZJwtCwv8ogplxQx5xlL7nERISw0hxSdViNN3UBsdp_dXFfSrKPOA1ah52BeMFLeW/exec';

const LEVEL_GOALS = {
  0: { target: 7,  reward: 7,  label: 'Pipes' },
  1: { target: 7,  reward: 7,  label: 'Princess' },
  2: { target: 7,  reward: 7,  label: 'Laptops' },
  3: { target: 77, reward: 77, label: 'Dance' },
  4: { target: 7,  reward: 7,  label: 'Spins' },
  5: { target: 7,  reward: 7,  label: 'Streams' },
  6: { target: 1,  reward: 77, label: 'Ending' }
};

const LEVEL_ICONS = ['🐦','🍄','🐍','💃','🎰','⛵','🏠'];

// ============================================================
// DOM
// ============================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const overlayEl = document.getElementById('overlay');
const hudEl = document.getElementById('hud');
const hudPtsEl = document.getElementById('hud-pts');
const hudLivesEl = document.getElementById('hud-lives');
const touchEl = document.getElementById('touch');
const jumpBtnEl = document.getElementById('jump-btn');
const riverControlsEl = document.getElementById('river-controls');
const riverUpBtn = document.getElementById('river-up');
const riverDownBtn = document.getElementById('river-down');

function fitCanvas(){
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width  = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 120));
fitCanvas();

// ============================================================
// STATE — playerId persisted
// ============================================================
function getOrCreatePlayerId(){
  try{
    let pid = localStorage.getItem('shoptorshi_pid');
    if(!pid){
      pid = 'p_' + Math.random().toString(36).slice(2,11) + '_' + Date.now().toString(36);
      localStorage.setItem('shoptorshi_pid', pid);
    }
    return pid;
  }catch(e){
    return 'p_' + Math.random().toString(36).slice(2,11);
  }
}

const G = {
  screen: 'volume',
  lives: 7,
  points: 0,
  unlocked: [true,false,false,false,false,false,false],
  completed:[false,false,false,false,false,false,false],
  playerId: getOrCreatePlayerId(),
  online: false
};
let levelIdx = 0;
let L = null;
let wonThisSession = false;

// ============================================================
// GOOGLE SHEETS SYNC
// ============================================================
async function apiGet(params){
  const q = new URLSearchParams(params).toString();
  const url = API + '?' + q;
  try{
    const res = await fetch(url, { method: 'GET' });
    return await res.json();
  }catch(e){
    console.warn('API error', e);
    return null;
  }
}

async function loadPlayerFromCloud(){
  const data = await apiGet({ action: 'getPlayer', playerId: G.playerId });
  if(!data || !data.success) return;
  G.points = data.totalPoints || 0;
  G.online = true;
  if(Array.isArray(data.levelsUnlocked)){
    for(let i=0;i<7;i++){
      if(data.levelsUnlocked[i]) G.unlocked[i] = true;
    }
  }
  refreshHUD();
}

function syncScoreToCloud(points){
  if(!G.online) return;
  apiGet({ action: 'updateScore', playerId: G.playerId, points: points });
}

function syncUnlockToCloud(level){
  if(!G.online) return;
  apiGet({ action: 'unlockLevel', playerId: G.playerId, level: level });
}

// ============================================================
// PARTICLE FX
// ============================================================
const FX = {
  particles: [],
  shakeT: 0, shakeMag: 0,
  spawn(x, y, count, color, opts={}){
    for(let i=0;i<count;i++){
      const a = Math.random() * Math.PI * 2;
      const spd = 60 + Math.random() * (opts.speed || 140);
      FX.particles.push({
        x, y,
        vx: Math.cos(a)*spd,
        vy: Math.sin(a)*spd - (opts.up || 40),
        life: opts.life || 0.6,
        maxLife: opts.life || 0.6,
        color: color,
        size: opts.size || 3
      });
    }
  },
  shake(mag, time=0.25){ FX.shakeMag = Math.max(FX.shakeMag, mag); FX.shakeT = Math.max(FX.shakeT, time); },
  update(dt){
    for(let i=FX.particles.length-1;i>=0;i--){
      const p = FX.particles[i];
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vy += 260*dt;
      p.vx *= 0.98;
      p.life -= dt;
      if(p.life <= 0) FX.particles.splice(i,1);
    }
    if(FX.shakeT > 0){ FX.shakeT -= dt; if(FX.shakeT <= 0) FX.shakeMag = 0; }
  },
  draw(ctx){
    for(const p of FX.particles){
      const a = p.life / p.maxLife;
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  },
  reset(){ FX.particles.length = 0; FX.shakeT = 0; FX.shakeMag = 0; }
};

// ============================================================
// ASSETS
// ============================================================
const A = { still:null, hurt:null, walk:[null,null,null], jump:[null,null,null], fall:[null,null,null], music:{} };

function loadImg(src){
  return new Promise(res=>{
    const i = new Image();
    i.onload = ()=>res(i);
    i.onerror = ()=>res(null);
    i.src = src;
  });
}
function loadAudio(src){
  return new Promise(res=>{
    const a = new Audio();
    a.preload = 'auto';
    a.addEventListener('canplaythrough', ()=>res(a), {once:true});
    a.addEventListener('error', ()=>res(null), {once:true});
    a.src = src;
    setTimeout(()=>res(a), 2200);
  });
}
async function loadAssets(){
  const bar = document.querySelector('#overlay .bar>div');
  const total = 14;
  let done = 0;
  const tick = ()=>{ done++; if(bar) bar.style.width = (done/total*100)+'%'; };
  const jobs = [];
  for(let i=1;i<=7;i++) jobs.push(loadAudio('l'+i+'.mp3').then(a=>{ A.music['l'+i] = a; tick(); }));
  jobs.push(loadImg('still.png').then(i=>{ A.still = i; tick(); }));
  jobs.push(loadImg('hurt.png').then(i=>{ A.hurt = i; tick(); }));
  for(let i=0;i<3;i++) jobs.push(loadImg('walk'+(i+1)+'.png').then(im=>{ A.walk[i] = im; tick(); }));
  for(let i=0;i<3;i++) jobs.push(loadImg('jump'+(i+1)+'.png').then(im=>{ A.jump[i] = im; tick(); }));
  for(let i=0;i<3;i++) jobs.push(loadImg('fall'+(i+1)+'.png').then(im=>{ A.fall[i] = im; tick(); }));
  await Promise.all(jobs);
}

// ============================================================
// MUSIC
// ============================================================
function stopAllMusic(){
  for(let i=1;i<=7;i++){
    const a = A.music['l'+i];
    if(a){ try{ a.pause(); a.currentTime = 0; }catch(e){} }
  }
}
function playMusic(n, loop=true){
  stopAllMusic();
  const a = A.music['l'+n];
  if(!a) return;
  try{
    a.loop = loop;
    a.currentTime = 0;
    a.volume = 1;
    const p = a.play();
    if(p && p.catch) p.catch(()=>{});
  }catch(e){}
}

// ============================================================
// HUD
// ============================================================
function refreshHUD(){
  hudPtsEl.textContent   = '★ ' + G.points;
  hudLivesEl.textContent = '❤ ' + G.lives;
}

// ============================================================
// OVERLAY
// ============================================================
function showOverlay(html){
  overlayEl.innerHTML = html;
  overlayEl.classList.remove('hidden');
}
function hideOverlay(){
  overlayEl.classList.add('hidden');
  overlayEl.innerHTML = '';
}

function showVolumeNotice(){
  G.screen = 'volume';
  hudEl.classList.add('hidden');
  touchEl.classList.add('hidden');
  riverControlsEl.classList.add('hidden');
  destroyLevel();
  stopAllMusic();

  showOverlay(`
    <div class="speaker">🔊</div>
    <h1>SHOPTORSHI</h1>
    <p class="vol-warn">⚠ Turn your volume ALL THE WAY UP ⚠</p>
    <p>This game has custom soundtracks for every level.</p>
    <div class="btn-row">
      <button class="obtn yellow" id="btn-ready">🔊 I'm Ready</button>
    </div>
  `);
  document.getElementById('btn-ready').addEventListener('click', ()=>{
    try{
      const silent = A.music['l1'];
      if(silent){ silent.volume = 0; silent.play().then(()=>{ silent.pause(); silent.volume = 1; }).catch(()=>{}); }
    }catch(e){}
    bootLoad();
  });
}

function showLoading(){
  G.screen = 'loading';
  showOverlay(`
    <div class="hearts">
      <div class="heart"></div><div class="heart"></div><div class="heart"></div>
      <div class="heart"></div><div class="heart"></div><div class="heart"></div>
      <div class="heart"></div>
    </div>
    <h1>SHOPTORSHI</h1>
    <p>Loading…</p>
    <div class="bar"><div></div></div>
  `);
}
async function bootLoad(){
  showLoading();
  try{ await loadAssets(); }catch(e){ console.error(e); }
  loadPlayerFromCloud().finally(()=> showMenu());
}

function showMenu(){
  G.screen = 'menu';
  wonThisSession = false;
  stopAllMusic();
  FX.reset();
  hudEl.classList.add('hidden');
  touchEl.classList.add('hidden');
  riverControlsEl.classList.add('hidden');
  destroyLevel();
  releaseAllButtons();

  let grid = '';
  for(let i=0;i<7;i++){
    const locked = !G.unlocked[i];
    const done = G.completed[i];
    const cls = 'lvl' + (locked?' locked':'') + (done?' done':'');
    const goal = LEVEL_GOALS[i];
    grid += `<div class="${cls}" data-lvl="${i}">
      <span class="icon">${LEVEL_ICONS[i]}</span>
      <span>${i+1}</span>
      <small>${goal.target} ${goal.label.toLowerCase()}</small>
    </div>`;
  }
  const syncLabel = G.online ? '☁ SYNCED' : '☁ OFFLINE';
  showOverlay(`
    <h1>SHOPTORSHI</h1>
    <p>7 lives per level · 7 mini games</p>
    <div class="grid">${grid}</div>
    <p style="margin-top:14px;font-size:.75em">Earn 7 points in a level to unlock the next</p>
    <p style="margin-top:6px;font-size:.7em;color:${G.online?'#64ffb4':'#8878b8'}">${syncLabel} · ★ ${G.points}</p>
    <div class="btn-row" style="margin-top:12px">
      <button class="obtn" id="btn-jukebox">🎵 JUKEBOX</button>
    </div>
  `);

  overlayEl.querySelectorAll('.lvl').forEach(el=>{
    if(el.classList.contains('locked')) return;
    el.addEventListener('click', ()=>startLevel(parseInt(el.dataset.lvl)));
  });
  document.getElementById('btn-jukebox').addEventListener('click', showJukebox);
}

function showJukebox(){
  G.screen = 'jukebox';
  stopAllMusic();
  hudEl.classList.add('hidden');
  touchEl.classList.add('hidden');
  riverControlsEl.classList.add('hidden');
  destroyLevel();
  releaseAllButtons();

  const tracks = [
    {n:1, name:'Level 1 — Flappy'},
    {n:2, name:'Level 2 — Princess'},
    {n:3, name:'Level 3 — Hacker'},
    {n:4, name:'Level 4 — Dance'},
    {n:5, name:'Level 5 — 777'},
    {n:6, name:'Level 6 — River'},
    {n:7, name:'Level 7 — Home'}
  ];
  const btnHtml = tracks.map(t =>
    `<button class="music-btn" data-track="${t.n}">♪ ${t.name}</button>`
  ).join('');

  showOverlay(`
    <h2>🎵 JUKEBOX</h2>
    <p>Listen to the soundtracks</p>
    <div class="music-row">${btnHtml}</div>
    <div class="btn-row" style="margin-top:16px">
      <button class="obtn" id="btn-stop">⏹ STOP</button>
      <button class="obtn" id="btn-back">BACK TO MENU</button>
    </div>
  `);

  let currentBtn = null;
  overlayEl.querySelectorAll('.music-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const n = parseInt(btn.dataset.track);
      stopAllMusic();
      if(currentBtn) currentBtn.classList.remove('playing');
      playMusic(n, true);
      currentBtn = btn;
      btn.classList.add('playing');
    });
  });
  document.getElementById('btn-stop').addEventListener('click', ()=>{
    stopAllMusic();
    if(currentBtn){ currentBtn.classList.remove('playing'); currentBtn = null; }
  });
  document.getElementById('btn-back').addEventListener('click', showMenu);
}

function showComplete(firstTime = true){
  G.screen = 'complete';
  hudEl.classList.add('hidden');
  touchEl.classList.add('hidden');
  riverControlsEl.classList.add('hidden');
  stopAllMusic();
  releaseAllButtons();
  FX.reset();

  const nextIdx = levelIdx + 1;
  const hasNext = nextIdx < 7 && G.unlocked[nextIdx];
  const nextBtn = hasNext ? `<button class="obtn green" id="btn-next">NEXT LEVEL</button>` : '';
  const isLast = levelIdx === 6;
  const keepBtn = !isLast ? `<button class="obtn yellow" id="btn-keep">PLAY AGAIN</button>` : '';
  const reward = LEVEL_GOALS[levelIdx].reward;
  const rewardText = firstTime
    ? `+${reward} points! Total: ${G.points}`
    : `Already beaten — Total: ${G.points}`;
  const musicBtn = `<button class="obtn" id="btn-music">🎵 LISTEN</button>`;

  showOverlay(`
    <h2>LEVEL ${levelIdx+1} COMPLETE!</h2>
    <p>${rewardText}</p>
    ${hasNext ? '<p style="color:#64ffb4">🔓 New level unlocked!</p>' : ''}
    <div class="btn-row">
      ${keepBtn}
      ${nextBtn}
      ${musicBtn}
      <button class="obtn" id="btn-menu">MENU</button>
    </div>
    <div id="music-panel" style="margin-top:14px;display:none"></div>
  `);

  if(!isLast) document.getElementById('btn-keep').addEventListener('click', ()=>startLevel(levelIdx));
  if(hasNext) document.getElementById('btn-next').addEventListener('click', ()=>startLevel(nextIdx));
  document.getElementById('btn-menu').addEventListener('click', showMenu);

  document.getElementById('btn-music').addEventListener('click', ()=>{
    const panel = document.getElementById('music-panel');
    if(panel.style.display === 'none'){
      panel.style.display = 'block';
      panel.innerHTML = `
        <p style="color:#ffd700;margin-bottom:8px">♪ Now playing: Level ${levelIdx+1}</p>
        <div class="btn-row">
          <button class="obtn yellow" id="btn-replay">▶ REPLAY</button>
          <button class="obtn red" id="btn-stop">⏹ STOP</button>

      `;
      playMusic(levelIdx + 1, true);

        panel.style.display = 'none';

    } else {
      stopAllMusic();
      panel.style.display = 'none';
    }
  });
}

// ============================================================
// LEVEL FLOW
// ============================================================
function startLevel(idx){
  if(idx < 0 || idx > 6) return;
  if(!G.unlocked[idx]) return;

  destroyLevel();
  levelIdx = idx;
  wonThisSession = false;
  FX.reset();

  hideOverlay();
  hudEl.classList.remove('hidden');

  // Hide all controls first
  touchEl.classList.add('hidden');
  riverControlsEl.classList.add('hidden');
  jumpBtnEl.style.display = 'none';

  if(idx === 1){
    // Level 2 — platformer: D-pad + JUMP
    touchEl.classList.remove('hidden');
    jumpBtnEl.style.display = 'flex';
    jumpBtnEl.textContent = 'JUMP';
  } else if(idx === 5){
    // Level 6 — river: only up/down arrows
    riverControlsEl.classList.remove('hidden');
  } else if(idx === 6){
    // Level 7 — JRPG room: D-pad + PICK
    touchEl.classList.remove('hidden');
    jumpBtnEl.style.display = 'flex';
    jumpBtnEl.textContent = 'PICK';
  }

  G.lives = 7;
  refreshHUD();

  if(idx !== 6) playMusic(idx + 1, true);

  L = LEVEL_FACTORIES[idx]();
  G.screen = 'playing';
  if(L.init) L.init();
}

function destroyLevel(){
  if(L && L.destroy){
    try{ L.destroy(); }catch(e){ console.error(e); }
  }
  L = null;
}

function completeLevel(){
  if(G.screen !== 'playing') return;
  if(wonThisSession) return;
  wonThisSession = true;

  const firstTime = !G.completed[levelIdx];
  const reward = LEVEL_GOALS[levelIdx].reward;

  if(firstTime){
    G.completed[levelIdx] = true;
    if(levelIdx < 6) G.unlocked[levelIdx + 1] = true;
    G.points += reward;
    refreshHUD();
    syncScoreToCloud(reward);
    if(levelIdx < 6) syncUnlockToCloud(levelIdx + 2);
  }
  showComplete(firstTime);
}

function loseLife(){
  if(G.screen !== 'playing') return true;
  G.lives--;
  refreshHUD();
  FX.shake(10, 0.3);
  if(G.lives <= 0){ showGameOver(); return true; }
  return false;
}

// ============================================================
// MAIN LOOP
// ============================================================
let lastT = performance.now();
function loop(t){
  requestAnimationFrame(loop);
  const dt = Math.min((t - lastT) / 1000, 0.05);
  lastT = t;

  FX.update(dt);

  if(G.screen === 'playing' && L){
    try{ if(L.update) L.update(dt); }catch(e){ console.error('update', e); }
  }

  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#1a1040');
  bgGrad.addColorStop(0.5, '#2a1a5e');
  bgGrad.addColorStop(1, '#1a1040');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  drawGlobalClouds(ctx);

  if(G.screen === 'playing' && L){
    ctx.save();
    if(FX.shakeT > 0){
      const m = FX.shakeMag * (FX.shakeT / 0.25);
      ctx.translate((Math.random()-0.5)*m, (Math.random()-0.5)*m);
    }
    try{ if(L.draw) L.draw(ctx); }catch(e){ console.error('draw', e); }
    ctx.restore();
    FX.draw(ctx);
  }
}
requestAnimationFrame(loop);

const globalClouds = [];
for(let i=0;i<8;i++){
  globalClouds.push({
    x: Math.random() * (W + 200) - 100,
    y: 20 + Math.random() * 200,
    speed: 8 + Math.random() * 20,
    scale: 0.6 + Math.random() * 0.8,
    layer: Math.random()
  });
}
function drawGlobalClouds(ctx){
  for(const c of globalClouds){
    c.x += c.speed * 0.016;
    if(c.x > W + 150) c.x = -150;
    const alpha = c.layer < 0.5 ? 0.06 : 0.1;
    ctx.fillStyle = `rgba(200,190,255,${alpha})`;
    const s = 6 * c.scale;
    const cx = c.x, cy = c.y;
    ctx.fillRect(cx - s*3, cy - s, s*6, s*2);
    ctx.fillRect(cx - s*4, cy, s*8, s*2);
    ctx.fillRect(cx - s*2, cy - s*2, s*4, s*2);
    ctx.fillRect(cx - s*5, cy + s, s*10, s*1.5);
  }
}

// TOUCH CONTROLS
// ============================================================
function bindBtn(el){
  const key = el.dataset.k;
  const press = (e)=>{
    e.preventDefault();
    e.stopPropagation();
    el.classList.add('active');
    if(L && L.keys) L.keys[key] = true;
    // Special: the round button doubles as JUMP or PICK
    if(L && key === 'jump'){
      if(L.jump) L.jump();
      else if(L.pick) L.pick();
    }
  };
  const release = (e)=>{
    e.preventDefault();
    el.classList.remove('active');
    if(L && L.keys) L.keys[key] = false;
  };
  el.addEventListener('pointerdown', press);
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  el.addEventListener('pointerleave', release);
}
document.querySelectorAll('#touch .btn').forEach(bindBtn);

// River buttons
function bindRiverBtn(el, fnName){
  const press = (e)=>{
    e.preventDefault();
    e.stopPropagation();
    el.classList.add('active');
    if(L && L[fnName]) L[fnName]();
  };
  const release = (e)=>{
    e.preventDefault();
    el.classList.remove('active');
  };
  el.addEventListener('pointerdown', press);
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  el.addEventListener('pointerleave', release);
}
bindRiverBtn(riverUpBtn, 'hopUp');
bindRiverBtn(riverDownBtn, 'hopDown');

function releaseAllButtons(){

}
